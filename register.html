<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>إنشاء حساب — VIZORA AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #070711;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .glow {
      position: fixed;
      width: 430px;
      height: 430px;
      background: #6c2cff;
      filter: blur(180px);
      opacity: 0.18;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .register-box {
      width: 100%;
      max-width: 450px;
      position: relative;
      z-index: 2;
      padding: 38px 30px;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.045);
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 80px rgba(0,0,0,0.45);
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo {
      width: 58px;
      height: 58px;
      margin: 0 auto 15px;
      border-radius: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      background: linear-gradient(135deg, #00e5ff, #7c3cff, #ff3cac);
      box-shadow: 0 0 30px rgba(124,60,255,0.45);
    }

    .brand h1 {
      font-size: 27px;
      margin-bottom: 8px;
    }

    .brand p {
      color: #9999ae;
      font-size: 14px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #d7d7e5;
    }

    .field input {
      width: 100%;
      padding: 14px;
      border-radius: 13px;
      border: 1px solid rgba(255,255,255,0.1);
      outline: none;
      background: rgba(0,0,0,0.25);
      color: white;
      font-size: 15px;
    }

    .field input:focus {
      border-color: #8b5cff;
      box-shadow: 0 0 0 3px rgba(139,92,255,0.12);
    }

    .create-button {
      width: 100%;
      padding: 15px;
      margin-top: 8px;
      border: none;
      border-radius: 13px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: linear-gradient(90deg, #6c2cff, #b63cff);
      transition: 0.3s;
    }

    .create-button:hover {
      transform: translateY(-2px);
    }

    .terms {
      color: #77778c;
      font-size: 12px;
      line-height: 1.7;
      text-align: center;
      margin-top: 18px;
    }

    .login {
      text-align: center;
      margin-top: 22px;
      color: #9292a7;
      font-size: 14px;
    }

    .login a {
      color: #b995ff;
      text-decoration: none;
      font-weight: bold;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #77778c;
      text-decoration: none;
      font-size: 13px;
    }

    .back:hover {
      color: white;
    }

    @media (max-width: 480px) {
      .register-box {
        padding: 30px 20px;
      }
    }
  </style>
</head>

<body>

<div class="glow"></div>

<div class="register-box">

  <div class="brand">

    <div class="logo">
      ▶
    </div>

    <h1>إنشاء حساب</h1>

    <p>ابدأ رحلتك مع VIZORA AI 🚀</p>

  </div>


  <form onsubmit="createAccount(event)">

    <div class="field">
      <label>الاسم</label>

      <input
        type="text"
        id="name"
        placeholder="اكتب اسمك"
        required
      >
    </div>


    <div class="field">
      <label>البريد الإلكتروني</label>

      <input
        type="email"
        id="email"
        placeholder="example@email.com"
        required
      >
    </div>


    <div class="field">
      <label>كلمة المرور</label>

      <input
        type="password"
        id="password"
        placeholder="8 أحرف على الأقل"
        minlength="8"
        required
      >
    </div>


    <div class="field">
      <label>تأكيد كلمة المرور</label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="أعد كتابة كلمة المرور"
        minlength="8"
        required
      >
    </div>


    <button class="create-button" type="submit">
      إنشاء الحساب
    </button>

  </form>


  <div class="terms">
    بإنشاء الحساب، أنت توافق على شروط استخدام VIZORA
    وسياسة الخصوصية.
  </div>


  <div class="login">
    لديك حساب بالفعل؟
    <a href="login.html">تسجيل الدخول</a>
  </div>


  <a class="back" href="index.html">
    ← العودة إلى الصفحة الرئيسية
  </a>

</div>


<script>

  function createAccount(event) {

    event.preventDefault();

    const name =
      document.getElementById("name").value.trim();

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const confirmPassword =
      document.getElementById("confirmPassword").value;


    if (password !== confirmPassword) {

      alert("كلمتا المرور غير متطابقتين ❌");

      return;
    }


    alert(
      "تم إنشاء الحساب بنجاح 🎉\n\n" +
      "مرحبًا " + name +
      "\n\nسيتم تفعيل الحسابات الحقيقية في المرحلة القادمة."
    );

  }

</script>

</body>
  </html>
